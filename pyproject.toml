[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "support-ops-lakehouse"
version = "0.2.0"
description = "Support operations lakehouse, SLA-risk prediction, and grounded AI triage"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "All rights reserved" }
authors = [{ name = "varsh1ta31" }]
dependencies = []

[project.scripts]
support-ops-generate = "support_ops.synthetic.cli:main"
support-ops-bootstrap = "support_ops.platform.bootstrap:main"
support-ops-batch-ingest = "support_ops.ingestion.batch:main"
support-ops-silver = "support_ops.transformations.silver:main"
support-ops-generate-events = "support_ops.synthetic.events:main"
support-ops-stream-ingest = "support_ops.ingestion.streaming:main"

support-ops-gold = "support_ops.transformations.gold:main"
support-ops-customer-health = "support_ops.transformations.customer_health:main"
support-ops-incident-signals = "support_ops.transformations.incident_signals:main"
support-ops-ticket-features = "support_ops.transformations.ticket_features:main"
support-ops-performance = "support_ops.performance:main"
support-ops-training-dataset = "support_ops.training_dataset:main"
support-ops-historical-features = "support_ops.transformations.historical_features:main"

[project.optional-dependencies]
spark-test = ["delta-spark==4.0.0", "pyspark==4.0.0"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_ops"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=support_ops --cov-report=term-missing"
testpaths = ["tests"]
markers = ["spark: requires local Spark, Delta Lake, and Java 17 or newer"]

[tool.coverage.run]
branch = true
source = ["support_ops"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true
