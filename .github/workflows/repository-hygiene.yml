name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject committed local and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(\.env([^/]+)?|\.venv|\.databricks|\.bundle|data|artifacts|mlruns|checkpoints)(/|$)'
          if git ls-files | grep -E "$forbidden" | grep -vE '(^|/)\.env\.example$'; then
            echo "Generated artifacts or local configuration were committed."
            exit 1
          fi

      - name: Reject oversized files
        shell: bash
        run: |
          set -euo pipefail
          limit=$((10 * 1024 * 1024))
          while IFS= read -r -d '' file; do
            size=$(stat -c %s "$file")
            if (( size > limit )); then
              echo "$file is larger than 10 MiB ($size bytes)."
              exit 1
            fi
          done < <(git ls-files -z)

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Lint and type-check
        run: make lint

      - name: Test
        run: make test

      - name: Build deployment wheel
        run: python -m build --wheel

      - name: Validate YAML syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path(".").rglob("*.yml")):
              yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"valid yaml: {path}")
          PY
