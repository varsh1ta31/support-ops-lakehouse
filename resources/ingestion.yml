resources:
  jobs:
    batch_ingestion:
      name: support-ops-batch-ingestion
      max_concurrent_runs: 1
      tasks:
        - task_key: bootstrap_catalog
          python_wheel_task:
            package_name: support_ops_lakehouse
            entry_point: support-ops-bootstrap
            parameters:
              - --catalog
              - ${var.catalog}
          environment_key: default

        - task_key: ingest_products
          depends_on:
            - task_key: bootstrap_catalog
          python_wheel_task:
            package_name: support_ops_lakehouse
            entry_point: support-ops-batch-ingest
            parameters:
              - --entity
              - products
              - --source
              - /Volumes/${var.catalog}/raw/landing/products
              - --catalog
              - ${var.catalog}
              - --pipeline-run-id
              - "{{job.run_id}}"
          environment_key: default

        - task_key: ingest_accounts
          depends_on:
            - task_key: bootstrap_catalog
          python_wheel_task:
            package_name: support_ops_lakehouse
            entry_point: support-ops-batch-ingest
            parameters:
              - --entity
              - accounts
              - --source
              - /Volumes/${var.catalog}/raw/landing/accounts
              - --catalog
              - ${var.catalog}
              - --pipeline-run-id
              - "{{job.run_id}}"
          environment_key: default

        - task_key: ingest_contracts
          depends_on:
            - task_key: bootstrap_catalog
          python_wheel_task:
            package_name: support_ops_lakehouse
            entry_point: support-ops-batch-ingest
            parameters:
              - --entity
              - contracts
              - --source
              - /Volumes/${var.catalog}/raw/landing/contracts
              - --catalog
              - ${var.catalog}
              - --pipeline-run-id
              - "{{job.run_id}}"
          environment_key: default

        - task_key: ingest_tickets
          depends_on:
            - task_key: bootstrap_catalog
          python_wheel_task:
            package_name: support_ops_lakehouse
            entry_point: support-ops-batch-ingest
            parameters:
              - --entity
              - tickets
              - --source
              - /Volumes/${var.catalog}/raw/landing/tickets
              - --catalog
              - ${var.catalog}
              - --pipeline-run-id
              - "{{job.run_id}}"
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
